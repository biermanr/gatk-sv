# miniwdl config for running GATK-SV on Della via miniwdl-slurm + Apptainer.
# Pass to miniwdl with:  miniwdl run --cfg /scratch/gpfs/AKEY/rbierman/gatk-sv/miniwdl/miniwdl.cfg ...
# (or export MINIWDL_CFG=<this file>)

[scheduler]
# Each WDL task becomes its own `sbatch` job (miniwdl-slurm plugin).
container_backend = slurm_singularity
# How many task jobs may be in-flight (queued/running) at once. The gCNV
# scatter can fan out to ~287; this bounds concurrent sbatch jobs.
#
# Lowered from 100 to 20 on 2026-08-06. Under cluster saturation, firing 100
# concurrent sbatch calls draws "Batch job submission failed: Resource
# temporarily unavailable". miniwdl-slurm does not retry submission, so that
# fails the task; miniwdl then retries the task and crashes on an assertion in
# copy_input_files (see below), killing the run. Two runs died this way in
# ResolveComplexVariants/RestoreUnresolvedCnv.
#
# This only reduces how often the transient is provoked -- it does not fix the
# underlying miniwdl bug. With the cluster ~97% allocated we were being granted
# only a handful of concurrent slots anyway, so a lower cap costs no real
# throughput here. Raise it again once contention eases.
#
# The miniwdl bug (v1.14.2): WDL/runtime/task.py:595-602 calls
# container.copy_input_files() inside the `while True` retry loop, but
# backend/cli_subprocess.py:141 asserts _bind_input_files and then clears it,
# so the second attempt always raises AssertionError. This makes ANY retry
# fatal for the tasks listed in copy_input_files_for below. Note
# task_container.reset() documents that copy_input_files() is meant to be
# retryable, and host_work_dir() is attempt-aware (work, work2, ...), while the
# base copy_input_files() still writes to the first attempt's work dir -- so a
# correct fix belongs upstream, not in a local monkey-patch.
task_concurrency = 20
# Abort the whole workflow on the first task failure instead of finishing
# independent branches (e.g. CNMOPS) that don't matter once a real blocker
# like the CondenseReadCounts EvalError is hit.
fail_fast = true

[file_io]
# Blanket copy_input_files=true (like Cromwell's copy localization) blew up disk
# usage badly at 100-sample scale: every per-sample task that merely *reads* the
# ~15GB CRAM (Whamg, Scramble, Manta, CollectSVEvidence, CollectCounts,
# CheckAligner, CollectWGDCounts...) got its own full copy, measured at ~211GB
# per fresh sample (should be a few tens of GB). Switched to bind-mounting by
# default, with copy_input_files_for listing only the tasks that actually
# mv/rm their own File inputs (verified via `grep -n "mv \|rm " *.wdl` cross-
# checked against each task's input block, restricted to tasks miniwdl check
# shows as actually reachable from GATKSVPipelineBatch.wdl -- e.g. SplitVcf and
# GetVcfSize have the same idiom but are dead code in this workflow, excluded):
#   LocalizeReads                  mv ~{reads_path} / ~{reads_index}   (GatherSampleEvidence.wdl)
#   MergeEvidence, SDtoBAF         mv ~{write_lines(...)} ...          (BatchEvidenceMerging.wdl)
#   RestoreUnresolvedCnv           mv/rm ~{resolved_vcf}/~{unresolved_vcf} (ResolveCpxSv.wdl)
#   StitchFragmentedCnvs           rm ~{vcf}                           (CleanVcfChromosome.wdl)
#   PlotQcPerFamily                rm ~{ped_file} ~{samples_list}      (MainVcfQc.wdl)
#   PostprocessGermlineCNVCalls    rm ~{contig_ploidy_calls_tar}       (GermlineCNVTasks.wdl)
#   GetRegenotype                  rm ~{regeno_raw_combined_depth} ~{depth_genotyped_vcf} (RegenotypeCNVs.wdl)
#   MakeRawCombinedBed             rm ~{sep=' ' vcfs}                  (RegenotypeCNVs.wdl)
# The original mv/rm-only grep missed in-place `gunzip` (same problem: modifies/
# deletes a read-only-mounted File input), found when porting the WGD/cohort-mode
# ploidy fixes from cromwell_slurm_ss made these reachable for the first time:
#   DetermineGermlineContigPloidyCohortMode,   grep gz$ ... | xargs gunzip on
#   DetermineGermlineContigPloidyCaseMode,     read_count_files -- Array[File]
#   GermlineCNVCallerCohortMode,               (GermlineCNVCohort.wdl /
#   GermlineCNVCallerCaseMode                   GermlineCNVCase.wdl)
# CaseMode variants aren't reachable at 3+ samples (cohort mode takes over) but
# added for single-sample-batch robustness.
copy_input_files = false
copy_input_files_for = ["LocalizeReads", "MergeEvidence", "SDtoBAF", "RestoreUnresolvedCnv", "StitchFragmentedCnvs", "PlotQcPerFamily", "PostprocessGermlineCNVCalls", "GetRegenotype", "MakeRawCombinedBed", "DetermineGermlineContigPloidyCohortMode", "DetermineGermlineContigPloidyCaseMode", "GermlineCNVCallerCohortMode", "GermlineCNVCallerCaseMode"]
# GATK-SV WDLs commonly derive index files by string concatenation (e.g.
# TinyResolve.wdl: `File discfile_idx = disc + ".tbi"`) instead of threading a
# real index File through as a tracked input/output. miniwdl's sandbox rejects
# these synthesized paths as not "expressly supplied" -- Cromwell doesn't
# enforce this at all, so the pattern is otherwise harmless. Trust any local
# path rather than chasing every instance of this idiom through the WDLs.
allow_any_input = true

[call_cache]
# File-based call cache so a re-run resumes completed tasks (no DB needed).
put = true
get = true
dir = /scratch/gpfs/AKEY/rbierman/gatk-sv/miniwdl/call_cache

[singularity]
# Use Apptainer (Della has no Docker). image_cache is pre-seeded with symlinks
# to the existing SIFs so offline compute nodes never need to pull.
exe = ["apptainer"]
image_cache = /scratch/gpfs/AKEY/rbierman/gatk-sv/miniwdl/image_cache
# No --fakeroot (not granted on Della). --cleanenv + --no-home stops host
# $HOME/user R libraries from leaking into the CNMOPS Bioconductor stack.
# --home /tmp: with --no-home, apptainer still sets $HOME inside the
# container to the real host path (e.g. /home/rb3242), but that path isn't
# mounted and the container rootfs is read-only, so anything writing under
# $HOME (arviz's cache dir, matplotlib config, etc.) crashes with
# FileNotFoundError/"Read-only file system". --home /tmp repoints $HOME at
# a location that exists and is writable in every image, without
# reintroducing the real host homedir bind that --no-home is there to block.
# Extra --bind: determine_svcount_outliers.R (used by PlotSVCountsPerSample,
# a diagnostic-only step whose outputs nothing downstream reads) crashes on
# an svcounts.txt with zero SV records -- colnames<-(NULL, ...) -- which a
# small/sparse batch can legitimately produce for one algorithm (e.g.
# Scramble). Patched locally at the path below to write an empty outliers
# file + placeholder plot instead of crashing; overriding the in-image copy
# here applies to every apptainer invocation, but is a no-op for images that
# don't have this path (apptainer creates the mount point and nothing
# references it) -- verified against the gatk image, which lacks
# /opt/sv-pipeline entirely.
run_options = ["--cleanenv", "--no-home", "--home", "/tmp", "--bind", "/scratch/gpfs/AKEY/rbierman/gatk-sv/src/sv-pipeline/scripts/downstream_analysis_and_filtering/determine_svcount_outliers.R:/opt/sv-pipeline/scripts/downstream_analysis_and_filtering/determine_svcount_outliers.R:ro"]

[slurm]
# Appended to every task's sbatch. Account AND a time limit are mandatory on
# Della (GATK-SV WDLs don't set miniwdl's time_minutes, so we set a blanket
# --time here; tasks finish earlier, and cpu partition allows up to 15 days).
extra_args = "--account=akey --partition=cpu --time=24:00:00"

[task_runtime]
# maxRetries: retry a task once on transient failure. Default docker is only a
# fallback for tasks lacking a docker attr (GATK-SV tasks all set one); the
# ubuntu:18.04 alias is pre-seeded in image_cache to stay offline-safe.
defaults = {"maxRetries": 1, "docker": "ubuntu:18.04"}
